# PostgreSQL and Redis for local development; the application itself runs on the host.
#
#   docker compose up -d
#   # then set DB_PASSWORD=postgres in .env and start the application (see README)
#
# On the first start PostgreSQL executes the scripts of /docker-entrypoint-initdb.d in
# alphabetical order, which creates the sandbox database. To start from scratch:
#   docker compose down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: Bank
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
