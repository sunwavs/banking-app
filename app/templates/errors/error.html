{% extends 'base.html' %}
{% block title %}{{ title }} — Звёздный банк{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="row align-items-center">
    <div class="col-md-12 text-center">
      <img src="{{ url_for('static', filename='img/ref.png') }}" class="img-fluid error-logo" alt="*">
    </div>
    <div class="col-md-12 mt-5 text-center alert alert-warning">
      <h3>{{ title }}</h3>
      {% if msg %}<h4 class="mt-3">{{ msg }}</h4>{% endif %}
    </div>
    <div class="col-md-12 text-center">
      <a class="btn btn-warning btn-lg text-light mt-3" href="{{ url_for('main.index') }}">На главную</a>
    </div>
  </div>
</div>
{% endblock %}
