{% extends 'base.html' %}
{% from 'months.html' import month_options %}
{% block content %}
<div class="text-center">
  <h3>{{ report.title }}</h3>
  <h5>Введите параметры отчёта:</h5>
  <form action="{{ url_for('reports.report_create', slug=report.slug) }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="MonthReport">Месяц:</label>
    <select id="MonthReport" name="MonthReport" required>{{ month_options() }}</select>

    <label for="YearReport">Год:</label>
    <input type="number" id="YearReport" name="YearReport" min="{{ year_min }}" max="{{ year_max }}"
           value="{{ default_year }}" required>
    <br><br>
    <button type="submit" class="btn btn-warning text-light mt-2">Создать отчёт</button>
  </form>

  {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
  {% if no_data %}
    <div class="alert alert-warning mt-3"><h4>Нет информации за выбранный месяц. Отчёт не был создан.</h4></div>
  {% endif %}
  <a class="btn btn-warning btn-lg text-light mt-5" href="{{ url_for('reports.index') }}">Назад</a>
</div>
{% endblock %}
