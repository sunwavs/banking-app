{% macro render_card(cards_data) %}
<div class="overflow-auto">
  {% for data in cards_data %}
    <div class="card mb-4 ms-3 account-card">
      <div class="row g-0">
        <div class="col-md-8 border-0">
          <div class="card-body">
            <h5 class="card-title text-warning">{{ data['balance'] }}₽</h5>
            <p class="card-text text-secondary"><small>star basic</small></p>
            <p class="card-text text-warning">{{ data['account_num'] }}</p>
          </div>
        </div>
        <div class="col-md-4 border-0 text-center">
          <img src="{{ url_for('static', filename='img/star_basic.png') }}" class="rounded-start mt-3" alt="">
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endmacro %}
